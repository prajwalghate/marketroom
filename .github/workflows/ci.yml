name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from `packageManager` in package.json; naming it
      # here as well makes the action refuse to run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # Measured WCAG contrast over the design tokens, both themes.
      # A gate nobody runs is not a gate.
      - name: Contrast gate
        run: pnpm contrast

      - name: Build
        run: pnpm build

  catalog-coverage:
    name: Catalog covers the live venue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Data-drift check, not an uptime check: it skips cleanly if the upstream
    # API is unreachable rather than failing the build.
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from `packageManager` in package.json; naming it
      # here as well makes the action refuse to run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check catalog coverage
        run: pnpm catalog:check

      # Outbound links are the one thing no typecheck, lint or unit test can
      # validate — only asking the internet can. Three shipped broken once,
      # including the Trade button on every market.
      - name: Check outbound links
        run: pnpm links:check

  accessibility:
    name: Accessibility audit
    runs-on: ubuntu-latest
    # Every page in both themes, plus the mobile set: about half an hour.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from `packageManager` in package.json; naming it
      # here as well makes the action refuse to run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Playwright does not download browsers on install.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # axe-core over every page in both themes, plus keyboard and focus
      # checks axe does not perform. Needs the app running, so it builds and
      # starts it first; the research database fills itself as pages are read.
      - name: Accessibility audit
        run: |
          pnpm --filter @marketroom/web exec next build
          pnpm --filter @marketroom/web exec next start -p 3000 &
          npx wait-on http://localhost:3000 --timeout 120000
          BASE_URL=http://localhost:3000 pnpm a11y
