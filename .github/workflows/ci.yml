name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # Measured WCAG contrast over the design tokens, both themes.
      # A gate nobody runs is not a gate.
      - name: Contrast gate
        run: pnpm contrast

      - name: Build
        run: pnpm build

  catalog-coverage:
    name: Catalog covers the live venue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Data-drift check, not an uptime check: it skips cleanly if the upstream
    # API is unreachable rather than failing the build.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check catalog coverage
        run: pnpm catalog:check

      # Outbound links are the one thing no typecheck, lint or unit test can
      # validate — only asking the internet can. Three shipped broken once,
      # including the Trade button on every market.
      - name: Check outbound links
        run: pnpm links:check
